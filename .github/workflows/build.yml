name: Build EXE for Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas openpyxl pillow pyinstaller

      - name: Generate .spec file
        run: |
          pyi-makespec --onefile --windowed --name give_me_my_network table_merger_step6.py

      - name: Inject image file into .spec
        run: |
          echo. >> give_me_my_network.spec
          powershell -Command \"(Get-Content give_me_my_network.spec) -replace 'datas=\[\]', 'datas=\[\(\"3e60b959a71738e81e5b5d6f6c5ec03fe9563ab14ba3fc71258be4c84b017d74.png\", \".\"\)\]' | Set-Content give_me_my_network.spec\"

      - name: Build EXE from .spec
        run: pyinstaller give_me_my_network.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: give_me_my_network_exe
          path: dist/give_me_my_network.exe
